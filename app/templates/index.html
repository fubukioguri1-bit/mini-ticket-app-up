<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>簡易チケット管理</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .form-group { margin-bottom: 1rem; display: flex; gap: 0.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    .filters { margin: 1rem 0; }
    .error { color: red; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>簡易チケット管理</h1>

  <!-- 新規登録フォーム -->
  <div id="error-msg" class="error"></div>
  <form id="create-form" class="form-group">
    <input type="text" id="title" placeholder="チケット件名 (100文字以内)" required>
    <input type="text" id="assignee" placeholder="担当者 (50文字以内)" required>
    <button type="submit">登録</button>
  </form>

  <!-- ステータス絞り込み -->
  <div class="filters">
    絞り込み:
    <a href="/">すべて</a> |
    <a href="/?status=TODO">TODO</a> |
    <a href="/?status=DOING">DOING</a> |
    <a href="/?status=DONE">DONE</a>
  </div>

  <!-- チケット一覧 -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>件名</th>
        <th>担当者</th>
        <th>ステータス</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      {% for t in tickets %}
      <tr data-ticket-id="{{ t.id }}">
        <td>{{ t.id }}</td>
        <td>{{ t.title }}</td>
        <td>{{ t.assignee }}</td>
        <td>
          <select class="status-select" data-ticket-id="{{ t.id }}">
            <option value="TODO" {% if t.status == 'TODO' %}selected{% endif %}>TODO</option>
            <option value="DOING" {% if t.status == 'DOING' %}selected{% endif %}>DOING</option>
            <option value="DONE" {% if t.status == 'DONE' %}selected{% endif %}>DONE</option>
          </select>
        </td>
        <td>
          <button type="button" class="delete-btn" data-ticket-id="{{ t.id }}">削除</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <script src="../static/app.js" defer></script>
</body>
</html>
